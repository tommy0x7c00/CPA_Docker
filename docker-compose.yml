services:
  cpa-cli-proxy:
    image: eceasy/cli-proxy-api:latest
    container_name: cpa-cli-proxy
    # command: ["./CLIProxyAPI", "--local-model"]
    restart: unless-stopped
    ports:
      - "8317:8317"
      - "8085:8085"
      - "1455:1455"
      - "54545:54545"
      - "51121:51121"
      - "11451:11451"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - CLIPROXY_PLUGIN_STORE_TOKEN=${CLIPROXY_PLUGIN_STORE_TOKEN:-}
    networks:
      default:
        aliases:
          - cli-proxy-api
    volumes:
      - ./config.yaml:/CLIProxyAPI/config.yaml
      - ./auths:/root/.cli-proxy-api
      - ./logs:/CLIProxyAPI/logs
      - ./plugins:/CLIProxyAPI/plugins

  cpa-manager-plus:
    image: seakee/cpa-manager-plus:latest
    container_name: cpa-manager-plus
    restart: unless-stopped
    ports:
      - "18317:18317"
    volumes:
      - ./manager-data:/data
    depends_on:
      - cpa-cli-proxy
